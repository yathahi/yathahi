name: Bug Report
description: Report unexpected behaviour or a problem in Yathahi.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Yathahi!
        Share whatever information you have. Incomplete reports are welcome.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: Observed Behaviour
      description: What happened?

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Start Yathahi...
        2. Configure...
        3. Observe...

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant system, version, or configuration details if available.
      placeholder: OS, Yathahi version, architecture, etc.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Logs, screenshots, or anything else that might help.
