name: Feature Request
description: Suggest a new capability or improvement for Yathahi.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Yathahi? We'd love to hear it.
        You don't need a complete technical design to suggest something.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to see?
      placeholder: Describe your idea.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem would this solve, or what opportunity does it address?

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you imagine this working?
      placeholder: Share your thoughts, even if they're incomplete.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Examples, references, screenshots, or related discussions.
